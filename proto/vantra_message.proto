syntax = "proto3";

package vantra.protocol;

option java_package = "me.vantra.proto";
option java_outer_classname = "VantraProto";

// Top-level wire message sent across Transport
message VantraWireEnvelope {
  uint32 protocol_version = 1;

  oneof payload {
    IdentitySecurePayload handshake = 2;
    EncryptedEnvelope encrypted_message = 3;
    ProtocolErrorPayload error = 4;
  }
}

// 1. Handshake Payload (Unencrypted wire format during initial connection)
message IdentitySecurePayload {
  string peer_id = 1;
  string display_name = 2;
  bytes identity_public_key = 3;  // 32 bytes Ed25519
  bytes ephemeral_public_key = 4; // 32 bytes X25519
  bytes signature = 5;            // 64 bytes Ed25519 signature
  // New in V2:
  uint32 min_supported_version = 6;
  uint32 max_supported_version = 7;
  repeated Capability supported_capabilities = 8;
}

// 2. Encrypted Envelope (Wire container for encrypted payloads)
message EncryptedEnvelope {
  string message_id = 1;
  string session_id = 2;
  uint64 sequence = 3;
  bytes nonce = 4;      // 12 bytes
  bytes ciphertext = 5; // Encrypted bytes of VantraPlaintext
  bytes mac = 6;        // 16 bytes Poly1305 tag
}

// 3. Plaintext Payload (Encrypted inside EncryptedEnvelope.ciphertext)
message VantraPlaintext {
  string message_id = 1;
  string session_id = 2;
  uint64 sequence = 3;
  int64 timestamp_ms = 4;
  string sender_id = 5;
  string receiver_id = 6;

  oneof body {
    TextBody text = 7;
    AckBody ack = 8;
    CapabilitiesExchange capabilities_exchange = 9; // New in V2
    MediaControl media_control = 10;
    MediaChunk media_chunk = 11;
  }
}

message MediaControl {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    OFFER = 1;
    ACCEPT = 2;
    REJECT = 3;
    CANCEL = 4;
  }
  Type type = 1;
  string transfer_id = 2;
  string file_name = 3;
  uint64 file_size = 4;
  string mime_type = 5;
  uint32 total_chunks = 6;
  uint32 chunk_size = 7;
  uint32 width = 8;
  uint32 height = 9;
  string caption = 10;
  uint32 next_expected_chunk = 11;
  string sha256 = 12;
}

message MediaChunk {
  string transfer_id = 1;
  uint32 chunk_index = 2;
  uint32 total_chunks = 3;
  bytes data = 4;
}

message CapabilitiesExchange {
  uint32 min_supported_version = 1;
  uint32 max_supported_version = 2;
  repeated Capability supported_capabilities = 3;
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_TEXT = 1;
  CAPABILITY_IMAGE = 2;
  CAPABILITY_AUDIO = 3;
  CAPABILITY_VIDEO = 4;
  CAPABILITY_FILE = 5;
  CAPABILITY_GROUP = 6;
}

message TextBody {
  string content = 1;
}

message AckBody {
  string original_message_id = 1;
  DeliveryStatus status = 2;
}

enum DeliveryStatus {
  DELIVERY_UNSPECIFIED = 0;
  DELIVERY_DELIVERED = 1;
}

// 4. Pre-session Protocol Error (Outer wire payload for unauthenticated version/malformed errors)
message ProtocolErrorPayload {
  uint32 error_code = 1;
  string error_message = 2;
  string related_message_id = 3;
}
